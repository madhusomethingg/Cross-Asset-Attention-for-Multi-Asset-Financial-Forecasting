# =============================================================================
# Streamlit configuration -- DARK theme that matches our slide deck.
# Deep navy background, ice-blue body text, gold accents.
# =============================================================================
[theme]
base = "dark"
primaryColor = "#F4A261"          # gold (sliders, primary buttons)
backgroundColor = "#0F1535"       # deep navy (main page background)
secondaryBackgroundColor = "#1E2761"   # navy (cards, expanders, sidebar)
textColor = "#CADCFC"             # ice blue (body text on dark bg)
font = "sans serif"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false
